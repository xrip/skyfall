server {
    listen 127.0.0.1:8443 ssl;
    server_name api.skyfall.akimus.ru;
    ssl_certificate /etc/letsencrypt/live/api.skyfall.akimus.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.skyfall.akimus.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    # Room tokens are query parameters; do not put them in access logs.
    access_log off;

    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location / { return 404; }
}

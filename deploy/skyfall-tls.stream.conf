map $ssl_preread_server_name $skyfall_tls_backend {
    api.skyfall.akimus.ru 127.0.0.1:8443;
    default 62.84.172.208:5349;
}

server {
    listen 62.84.172.208:443;
    ssl_preread on;
    preread_buffer_size 16k;
    proxy_pass $skyfall_tls_backend;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
}

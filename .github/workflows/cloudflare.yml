name: Deploy SKYFALL to Cloudflare Workers

# Нужны секреты репозитория:
#   CLOUDFLARE_API_TOKEN  — токен с правом Workers Scripts:Edit
#   CLOUDFLARE_ACCOUNT_ID — ID аккаунта Cloudflare
# Если секретов нет, деплой просто пропускается.
on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN не задан — пропускаем деплой."
          fi

      - name: Build static assets
        if: steps.check.outputs.ok == 'true'
        run: node tools/build-public.mjs

      - name: Deploy Worker
        if: steps.check.outputs.ok == 'true'
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

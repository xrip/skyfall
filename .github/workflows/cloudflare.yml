name: Deploy SKYFALL to Cloudflare

# Достаточно одного секрета: CLOUDFLARE_API_TOKEN.
# CLOUDFLARE_ACCOUNT_ID не обязателен — аккаунт определится по токену.
#
# Settings → Secrets and variables → Actions → New repository secret
#   CLOUDFLARE_API_TOKEN — токен Cloudflare (шаблон «Edit Cloudflare Workers»)
#
# Пока секрета нет, деплой пропускается и workflow остаётся зелёным.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверить ключ Cloudflare
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Деплой пропущен::Нет секрета CLOUDFLARE_API_TOKEN. Settings → Secrets and variables → Actions → New repository secret."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Node.js
        if: steps.token.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установить wrangler
        if: steps.token.outputs.ok == 'true'
        run: npm install --no-audit --no-fund

      - name: Определить аккаунт Cloudflare
        id: account
        if: steps.token.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "id=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_OUTPUT"
            echo "Аккаунт Cloudflare (из секрета): $CLOUDFLARE_ACCOUNT_ID"
          else
            id="$(node tools/cf-account.mjs)"
            echo "id=$id" >> "$GITHUB_OUTPUT"
            echo "Аккаунт Cloudflare: $id"
          fi

      - name: Собрать и задеплоить
        id: deploy
        if: steps.token.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.id }}
        run: |
          set -o pipefail
          npm run build
          npx wrangler deploy 2>&1 | tee deploy.log
          url="$(grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | head -n1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then echo "Игра доступна: $url"; fi

      - name: Итог
        if: always()
        run: |
          {
            echo "## SKYFALL"
            echo ""
            if [ "${{ steps.token.outputs.ok }}" != "true" ]; then
              echo "⏭️ **Деплой пропущен:** нет секрета \`CLOUDFLARE_API_TOKEN\`."
              echo ""
              echo "Settings → Secrets and variables → Actions → New repository secret, имя \`CLOUDFLARE_API_TOKEN\`."
            elif [ "${{ steps.deploy.outcome }}" = "success" ]; then
              echo "✅ **Задеплоено:** ${{ steps.deploy.outputs.url }}"
            else
              echo "❌ **Деплой не удался.** Смотрите лог шага «Собрать и задеплоить»."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
